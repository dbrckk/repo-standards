name: Reusable repository observability

on:
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20
          ref: ${{ github.ref_name }}

      - name: Generate CI, security and dependency summaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p .ai
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re, subprocess

          files = subprocess.check_output(["git","ls-files"], text=True).splitlines()

          # CI summary: exclude the standards workflow itself to avoid self-noise.
          ci_lines = ["# CI status", ""]
          try:
              raw = subprocess.check_output([
                  "gh","run","list","--limit","12",
                  "--json","name,status,conclusion,headSha,createdAt,event,url"
              ], text=True)
              runs = json.loads(raw)
              runs = [r for r in runs if r.get("name") != "Repository standards"][:8]
              if runs:
                  success_count = sum(1 for r in runs if r.get("conclusion") == "success")
                  failure_count = sum(1 for r in runs if r.get("conclusion") in {"failure","timed_out","action_required","startup_failure"})
                  active_count = sum(1 for r in runs if r.get("status") in {"queued","in_progress","pending","requested","waiting"})
                  ci_lines += [
                      f"Summary: {success_count} success / {failure_count} failure / {active_count} active",
                      ""
                  ]
                  for r in runs:
                      status = r.get("status") or "unknown"
                      conclusion = r.get("conclusion") or "pending"
                      sha = (r.get("headSha") or "")[:8]
                      ci_lines.append(f"- {r.get('name','workflow')}: {status} / {conclusion} ({sha})")
              else:
                  ci_lines.append("- No non-standards workflow runs found.")
          except Exception:
              ci_lines.append("- CI history unavailable to this workflow.")
          ci_lines += ["", "> Generated summary only; inspect GitHub Actions for full logs when needed.", ""]
          Path(".ai/ci-status.md").write_text("\n".join(ci_lines))

          # Security signals: report only category/path/line, never the matched value.
          patterns = [
              ("private_key_header", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")),
              ("github_pat", re.compile(r"gh[pousr]_[A-Za-z0-9_]{20,}")),
              ("aws_access_key", re.compile(r"AKIA[0-9A-Z]{16}")),
              ("generic_secret_assignment", re.compile(r"(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*['\"][^'\"]{12,}['\"]")),
          ]
          skip_ext = {".png",".jpg",".jpeg",".gif",".webp",".pdf",".zip",".jar",".apk",".aab",".so",".dll",".exe",".bin",".woff",".woff2"}
          skip_prefix = (".ai/","node_modules/","build/","dist/","vendor/")
          findings = []
          for path in files:
              if path.startswith(skip_prefix) or Path(path).suffix.lower() in skip_ext:
                  continue
              p = Path(path)
              try:
                  if p.stat().st_size > 500_000:
                      continue
                  text = p.read_text(errors="ignore")
              except Exception:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  for category, rx in patterns:
                      if rx.search(line):
                          test_like = path.startswith("tests/") or "/tests/" in path or Path(path).name.startswith("test_")
                          severity = "high" if category in {"private_key_header","aws_access_key","github_pat"} else "medium"
                          if test_like:
                              severity = "low" if category == "generic_secret_assignment" else "medium"
                          findings.append({
                              "category": category,
                              "path": path,
                              "line": lineno,
                              "context": "test_fixture_candidate" if test_like else "source",
                              "severity": severity
                          })
                          break
                  if len(findings) >= 100:
                      break
              if len(findings) >= 100:
                  break

          risky_names = []
          for path in files:
              low = path.lower()
              if low.endswith((".pem",".key",".p12",".pfx")) or low in {".env","id_rsa","id_ed25519"}:
                  risky_names.append(path)

          Path(".ai/security-signals.json").write_text(json.dumps({
              "schema_version": 1,
              "generated_by": "dbrckk/repo-standards",
              "note": "Heuristic signals only. Values are intentionally never emitted.",
              "potential_secret_locations": findings,
              "risky_tracked_filenames": risky_names[:100],
              "finding_count": len(findings),
              "high_severity_count": sum(1 for item in findings if item.get("severity") == "high"),
              "medium_severity_count": sum(1 for item in findings if item.get("severity") == "medium"),
              "low_severity_count": sum(1 for item in findings if item.get("severity") == "low"),
              "risky_filename_count": len(risky_names)
          }, indent=2) + "\n")

          # Lightweight dependency map from manifests/import roots.
          depmap = {
              "schema_version": 2,
              "generated_by": "dbrckk/repo-standards",
              "manifests": [],
              "external_dependencies": [],
              "inferred_imports": [],
              "internal_roots": [],
          }
          deps = set()
          inferred = set()
          manifests = []

          for path in files:
              name = Path(path).name
              if name in {"package.json","pyproject.toml","requirements.txt","build.gradle","build.gradle.kts","settings.gradle","settings.gradle.kts"}:
                  manifests.append(path)

              if name == "package.json":
                  try:
                      pkg = json.loads(Path(path).read_text())
                      for section in ("dependencies","devDependencies","peerDependencies","optionalDependencies"):
                          deps.update((pkg.get(section) or {}).keys())
                  except Exception:
                      pass

              elif name == "requirements.txt":
                  try:
                      for line in Path(path).read_text(errors="ignore").splitlines():
                          line = line.strip()
                          if not line or line.startswith(("#","-")):
                              continue
                          pkg = re.split(r"[<>=!~\[]", line, 1)[0].strip()
                          if pkg:
                              deps.add(pkg)
                  except Exception:
                      pass

              elif name == "pyproject.toml":
                  try:
                      import tomllib
                      data = tomllib.loads(Path(path).read_text())
                      project = data.get("project", {})
                      for item in project.get("dependencies", []) or []:
                          pkg = re.split(r"[<>=!~\[; ]", item, 1)[0].strip()
                          if pkg:
                              deps.add(pkg)
                  except Exception:
                      pass

          roots = []
          seen = set()
          source_exts = {".py",".js",".jsx",".ts",".tsx",".java",".kt",".kts",".gd",".rs",".go"}
          for path in files:
              p = Path(path)
              if p.suffix.lower() not in source_exts or "/" not in path:
                  continue
              root = path.split("/",1)[0]
              if root.startswith(".") or root in {"node_modules","build","dist","vendor"}:
                  continue
              if root not in seen:
                  seen.add(root)
                  roots.append(root)

          # Infer dependencies from source imports when manifests are absent or incomplete.
          internal_names = set(roots)
          try:
              import sys
              stdlib = set(getattr(sys, "stdlib_module_names", ()))
          except Exception:
              stdlib = set()

          for path in files:
              p = Path(path)
              if path.startswith((".ai/","build/","dist/","node_modules/","vendor/")):
                  continue
              try:
                  if p.stat().st_size > 300_000:
                      continue
                  text = p.read_text(errors="ignore")
              except Exception:
                  continue

              if p.suffix == ".py":
                  try:
                      import ast
                      tree = ast.parse(text)
                      for node in ast.walk(tree):
                          names = []
                          if isinstance(node, ast.Import):
                              names = [alias.name.split(".",1)[0] for alias in node.names]
                          elif isinstance(node, ast.ImportFrom) and node.module:
                              names = [node.module.split(".",1)[0]]
                          for name in names:
                              if name and name not in stdlib and name not in internal_names:
                                  inferred.add(name)
                  except Exception:
                      pass

              elif p.suffix.lower() in {".js",".jsx",".ts",".tsx",".mjs",".cjs"}:
                  for match in re.finditer(r"(?:from\s+|require\(|import\s*\()\s*['\"]([^'\"]+)['\"]", text):
                      name = match.group(1)
                      if name.startswith((".","/")):
                          continue
                      if name.startswith("@"):
                          parts = name.split("/")
                          pkg = "/".join(parts[:2]) if len(parts) >= 2 else name
                      else:
                          pkg = name.split("/",1)[0]
                      inferred.add(pkg)

              elif p.suffix.lower() in {".kt",".kts",".java"}:
                  for match in re.finditer(r"(?m)^\s*import\s+([A-Za-z0-9_.]+)", text):
                      dotted = match.group(1)
                      top = ".".join(dotted.split(".")[:2])
                      if not top.startswith(("java.","javax.","kotlin.")):
                          inferred.add(top)

          depmap["manifests"] = manifests[:100]
          depmap["external_dependencies"] = sorted(deps)[:500]
          depmap["inferred_imports"] = sorted(inferred - deps)[:500]
          depmap["internal_roots"] = roots[:100]
          Path(".ai/dependency-map.json").write_text(json.dumps(depmap, indent=2) + "\n")
          PY

      - name: Commit observability summaries
        shell: bash
        run: |
          git add .ai/ci-status.md .ai/security-signals.json .ai/dependency-map.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ai): refresh repository observability"
          git push origin "HEAD:${GITHUB_REF_NAME}"
