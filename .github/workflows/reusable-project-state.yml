name: Reusable project state

on:
  workflow_call:

permissions:
  contents: write

jobs:
  project-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20
          ref: ${{ github.ref_name }}

      - name: Refresh automatic project state
        shell: bash
        run: |
          mkdir -p .ai
          branch="${GITHUB_REF_NAME}"
          commit_sha="$(git rev-parse --short=12 HEAD)"
          commit_date="$(git log -1 --format=%cI)"
          commit_subject="$(git log -1 --format=%s)"
          tracked_files="$(git ls-files | wc -l | tr -d ' ')"
          recent_files="$(git log -n 5 --name-only --pretty=format: -- . ':!.ai/**' | sed '/^$/d' | awk '!seen[$0]++' | head -20)"

          {
            echo "<!-- AUTO:START -->"
            echo "## Automatic repository state"
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "### Git"
            printf -- '- Branch: `%s`\\n' "$branch"
            printf -- '- Head: `%s`\\n' "$commit_sha"
            echo "- Commit date: $commit_date"
            echo "- Commit: $commit_subject"
            echo "- Tracked files: $tracked_files"
            echo
            echo "### Recently changed files"
            if [ -n "$recent_files" ]; then
              while IFS= read -r file; do
                printf -- '- `%s`\\n' "$file"
              done <<< "$recent_files"
            else
              echo "- No recent source-file changes detected"
            fi
            echo
            echo "### Project signals"
            found=0
            for f in package.json pyproject.toml requirements.txt build.gradle build.gradle.kts settings.gradle settings.gradle.kts project.godot Dockerfile Makefile; do
              if [ -e "$f" ]; then
                printf -- '- `%s`\\n' "$f"
                found=1
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "- No common build descriptor detected"
            fi
            echo
            echo "> Generated by dbrckk/repo-standards. Keep manual priorities and blockers outside the AUTO markers."
            echo "<!-- AUTO:END -->"
          } > /tmp/auto-state.md

          python3 - <<'PY'
          from pathlib import Path
          import re

          target = Path(".ai/project-state.md")
          auto = Path("/tmp/auto-state.md").read_text().strip()

          if target.exists():
              text = target.read_text()
          else:
              text = """# Project state

          Status: active

          ## Working
          - Not documented yet.

          ## Broken / blockers
          - None documented yet.

          ## Current priority
          - Establish the current verified state.

          ## Validation
          - Use the repository's canonical validation commands.

          ## Last verified
          - Managed manually when meaningful project state changes.
          """

          pattern = re.compile(r"<!-- AUTO:START -->.*?<!-- AUTO:END -->", re.S)
          if pattern.search(text):
              text = pattern.sub(auto, text)
          else:
              text = text.rstrip() + "\n\n" + auto + "\n"

          target.write_text(text)
          PY

      - name: Commit project state
        shell: bash
        run: |
          if git diff --quiet -- .ai/project-state.md && git ls-files --error-unmatch .ai/project-state.md >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/project-state.md
          git commit -m "chore(ai): refresh project state"
          git push origin "HEAD:${GITHUB_REF_NAME}"
