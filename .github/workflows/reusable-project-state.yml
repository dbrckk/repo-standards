name: Reusable project state

on:
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  project-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          ref: ${{ github.ref_name }}

      - name: Build automatic project state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p .ai

          branch="${GITHUB_REF_NAME}"
          commit_sha="$(git rev-parse --short=12 HEAD)"
          commit_date="$(git log -1 --format=%cI)"
          commit_subject="$(git log -1 --format=%s)"
          recent_files="$(git log -n 5 --name-only --pretty=format: -- . ':!.ai/**' | sed '/^$/d' | awk '!seen[$0]++' | head -20)"
          tracked_files="$(git ls-files | wc -l | tr -d ' ')"

          signals=""
          for f in package.json pyproject.toml requirements.txt build.gradle build.gradle.kts settings.gradle settings.gradle.kts project.godot Dockerfile Makefile; do
            if [ -e "$f" ]; then
              signals="$signals- $f"$'\n'
            fi
          done
          if [ -z "$signals" ]; then
            signals="- No common build descriptor detected"$'\n'
          fi

          ci_summary="$(gh run list --limit 5 --json name,status,conclusion,headSha,createdAt,event             --jq '.[] | "- " + .name + ": " + .status + (if .conclusion != "" then " / " + .conclusion else "" end) + " (" + .headSha[0:8] + ")"' 2>/dev/null || true)"
          if [ -z "$ci_summary" ]; then
            ci_summary="- No recent workflow runs available"
          fi

          recent_md=""
          if [ -n "$recent_files" ]; then
            while IFS= read -r file; do
              recent_md="$recent_md- \`$file\`"$'\n'
            done <<< "$recent_files"
          else
            recent_md="- No recent source-file changes detected"$'\n'
          fi

          cat > /tmp/auto-state.md <<EOF
<!-- AUTO:START -->
## Automatic repository state

Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)

### Git
- Branch: \`$branch\`
- Head: \`$commit_sha\`
- Commit date: $commit_date
- Commit: $commit_subject
- Tracked files: $tracked_files

### Recently changed files
$recent_md
### Project signals
$signals
### Recent GitHub Actions
$ci_summary

> This section is generated by dbrckk/repo-standards. Keep manual priorities and blockers outside the AUTO markers.
<!-- AUTO:END -->
EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          target = Path(".ai/project-state.md")
          auto = Path("/tmp/auto-state.md").read_text()

          if target.exists():
              text = target.read_text()
          else:
              text = """# Project state

          Status: active

          ## Working
          - Not documented yet.

          ## Broken / blockers
          - None documented yet.

          ## Current priority
          - Establish the current verified state.

          ## Validation
          - Use the repository's canonical validation commands.

          ## Last verified
          - Updated automatically by repository standards.
          """

          pattern = re.compile(r"<!-- AUTO:START -->.*?<!-- AUTO:END -->", re.S)
          if pattern.search(text):
              text = pattern.sub(auto.strip(), text)
          else:
              text = text.rstrip() + "\n\n" + auto.strip() + "\n"

          target.write_text(text)
          PY

      - name: Commit project state
        shell: bash
        run: |
          if git diff --quiet -- .ai/project-state.md && git ls-files --error-unmatch .ai/project-state.md >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/project-state.md
          git commit -m "chore(ai): refresh project state"
          git push origin "HEAD:${GITHUB_REF_NAME}"
