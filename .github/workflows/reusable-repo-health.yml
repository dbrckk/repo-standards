name: Reusable repo health

on:
  workflow_call:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build health report
        shell: bash
        run: |
          mkdir -p .ai
          {
            echo "# Repository health"
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Core files"
            for f in README.md AGENTS.md SECURITY.md LICENSE; do
              if [ -e "$f" ]; then echo "- [x] $f"; else echo "- [ ] $f"; fi
            done
            echo
            echo "## Project signals"
            for f in package.json pyproject.toml requirements.txt build.gradle build.gradle.kts settings.gradle settings.gradle.kts project.godot Dockerfile; do
              if [ -e "$f" ]; then echo "- $f"; fi
            done
            echo
            echo "## Markers"
            echo "- TODO/FIXME count: $(grep -RIE --exclude-dir=.git --exclude-dir=.ai --exclude-dir=node_modules --exclude-dir=build --exclude-dir=dist 'TODO|FIXME' . 2>/dev/null | wc -l)"
            echo "- tracked files: $(git ls-files | wc -l)"
          } > .ai/repo-health.md

      - name: Commit health report
        shell: bash
        run: |
          if git diff --quiet -- .ai/repo-health.md && git ls-files --error-unmatch .ai/repo-health.md >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/repo-health.md
          git commit -m "chore(ai): refresh repo health"
          git push
