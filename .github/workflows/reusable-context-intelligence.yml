name: Reusable context intelligence

on:
  workflow_call:
    inputs:
      commit_changes:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  context-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 50
          ref: ${{ github.ref_name }}

      - name: Generate architecture, commands and change impact
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          mkdir -p .ai
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          file_set = set(files)

          def exists(path):
              return path in file_set or Path(path).exists()

          ignored = {".git", ".ai", ".github"}
          top_dirs, seen = [], set()
          for f in files:
              if "/" not in f:
                  continue
              top = f.split("/", 1)[0]
              if top in ignored or top in seen:
                  continue
              seen.add(top)
              top_dirs.append(top)

          project_types, descriptors = [], []
          ext_counts = {}
          for path in files:
              suffix = Path(path).suffix.lower()
              if suffix:
                  ext_counts[suffix] = ext_counts.get(suffix, 0) + 1

          inferred = [
              (".py", "python"),
              (".ts", "typescript"),
              (".tsx", "typescript"),
              (".js", "javascript"),
              (".jsx", "javascript"),
              (".kt", "kotlin"),
              (".kts", "kotlin"),
              (".java", "java"),
              (".gd", "gdscript"),
              (".rs", "rust"),
              (".go", "go"),
          ]
          for ext, kind in inferred:
              if ext_counts.get(ext, 0) >= 3 and kind not in project_types:
                  project_types.append(kind)

          checks = [
              ("package.json", "node"),
              ("pyproject.toml", "python"),
              ("requirements.txt", "python"),
              ("build.gradle", "gradle"),
              ("build.gradle.kts", "gradle"),
              ("settings.gradle", "gradle"),
              ("settings.gradle.kts", "gradle"),
              ("project.godot", "godot"),
              ("Dockerfile", "docker"),
              ("docker-compose.yml", "docker-compose"),
              ("docker-compose.yaml", "docker-compose"),
              ("Makefile", "make"),
          ]
          for path, kind in checks:
              if exists(path):
                  descriptors.append(path)
                  if kind not in project_types:
                      project_types.append(kind)

          entry_names = {
              "main.py","app.py","server.py","manage.py","index.js","index.ts",
              "main.js","main.ts","src/main.py","src/index.js","src/index.ts",
              "src/main.ts","src/main.js","app/src/main/AndroidManifest.xml",
              "project.godot","Dockerfile"
          }
          entrypoints = [f for f in files if f in entry_names]
          for f in files:
              if len(entrypoints) >= 20:
                  break
              if Path(f).name.lower() in {"main.py","main.kt","main.java","main.gd","app.py","server.py"} and f not in entrypoints:
                  entrypoints.append(f)

          source_exts = {".py",".ts",".tsx",".js",".jsx",".kt",".kts",".java",".gd",".rs",".go"}
          source_roots = []
          source_seen = set()
          test_roots = []
          test_seen = set()
          for path in files:
              p = Path(path)
              if p.suffix.lower() in source_exts:
                  root_name = path.split("/",1)[0] if "/" in path else "(root)"
                  if root_name not in source_seen:
                      source_seen.add(root_name)
                      source_roots.append(root_name)
              parts = p.parts
              if any(part.lower() in {"test","tests","spec","specs","__tests__"} for part in parts[:-1]):
                  root_name = path.split("/",1)[0] if "/" in path else "(root)"
                  if root_name not in test_seen:
                      test_seen.add(root_name)
                      test_roots.append(root_name)

          architecture = {
              "schema_version": 2,
              "generated_by": "dbrckk/repo-standards",
              "project_types": project_types,
              "descriptors": descriptors,
              "dominant_extensions": [
                  {"extension": ext, "count": count}
                  for ext, count in sorted(ext_counts.items(), key=lambda item: (-item[1], item[0]))[:12]
              ],
              "top_level_directories": top_dirs[:30],
              "source_roots": source_roots[:20],
              "test_roots": test_roots[:20],
              "entrypoint_candidates": entrypoints,
              "context_files": {
                  "project_state": ".ai/project-state.md",
                  "repo_health": ".ai/repo-health.md",
                  "repo_map": ".ai/repo-map.md",
                  "commands": ".ai/commands.json",
                  "change_impact": ".ai/change-impact.md"
              }
          }
          Path(".ai/architecture.json").write_text(json.dumps(architecture, indent=2) + "\n")

          commands = []
          def add(command, purpose, source, confidence="high"):
              item = {"command": command, "purpose": purpose, "source": source, "confidence": confidence}
              if item not in commands:
                  commands.append(item)

          if exists("package.json"):
              try:
                  pkg = json.loads(Path("package.json").read_text())
                  scripts = pkg.get("scripts", {})
                  for key in ("test","lint","build","typecheck","check","dev","start"):
                      if key in scripts:
                          cmd = "npm test" if key == "test" else ("npm start" if key == "start" else "npm run " + key)
                          add(cmd, key, "package.json")
              except Exception:
                  pass

          if exists("pyproject.toml"):
              try:
                  import tomllib
                  py = tomllib.loads(Path("pyproject.toml").read_text())
                  blob = json.dumps(py).lower()
                  if "pytest" in blob:
                      add("pytest", "test", "pyproject.toml")
                  if "ruff" in blob:
                      add("ruff check .", "lint", "pyproject.toml")
                  if "mypy" in blob:
                      add("mypy .", "typecheck", "pyproject.toml")
              except Exception:
                  pass
          elif exists("requirements.txt"):
              req = Path("requirements.txt").read_text(errors="ignore").lower()
              if "pytest" in req:
                  add("pytest", "test", "requirements.txt")

          python_tests = [p for p in files if p.endswith(".py") and (p.startswith("tests/") or "/tests/" in p) and Path(p).name.startswith("test_")]
          if python_tests and not any(item["purpose"] == "test" and "pytest" in item["command"] for item in commands):
              add("python -m pytest tests", "test", "detected Python tests", "medium")

          for path in files:
              if not (path.startswith("scripts/") and path.endswith(".sh")):
                  continue
              name = Path(path).stem.lower()
              if any(word in name for word in ("test","check","validate","doctor","smoke")):
                  add("bash " + path, "validation helper", path, "medium")
                  if len([x for x in commands if x["purpose"] == "validation helper"]) >= 8:
                      break

          if exists("gradlew"):
              add("./gradlew test", "test", "gradlew")
              add("./gradlew build", "build", "gradlew")
          elif exists("build.gradle") or exists("build.gradle.kts"):
              add("gradle test", "test", "Gradle descriptor", "medium")
              add("gradle build", "build", "Gradle descriptor", "medium")

          if exists("project.godot"):
              add("godot --headless --path . --editor --quit", "validate project load", "project.godot", "medium")

          if exists("Makefile"):
              text = Path("Makefile").read_text(errors="ignore")
              for target in ("test","lint","build","check"):
                  if any(line.startswith(target + ":") for line in text.splitlines()):
                      add("make " + target, target, "Makefile")

          Path(".ai/commands.json").write_text(json.dumps({
              "schema_version": 1,
              "generated_by": "dbrckk/repo-standards",
              "commands": commands
          }, indent=2) + "\n")

          before = os.getenv("EVENT_BEFORE", "").strip()
          head = os.getenv("EVENT_SHA", "").strip()

          def valid_commit(ref):
              if not ref or set(ref) == {"0"}:
                  return False
              p = subprocess.run(["git","cat-file","-e",ref + "^{commit}"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              return p.returncode == 0

          if not valid_commit(head):
              head = "HEAD"
          if not valid_commit(before):
              before = "HEAD~1" if valid_commit("HEAD~1") else head

          diff = subprocess.run(
              ["git","diff","--name-status",before,head,"--",".",":(exclude).ai/**"],
              capture_output=True, text=True
          ).stdout.strip()

          changed, statuses = [], {}
          for line in diff.splitlines():
              parts = line.split("\t")
              if len(parts) >= 2:
                  status, path = parts[0], parts[-1]
                  changed.append(path)
                  statuses[path] = status

          areas, seen = [], set()
          for path in changed:
              area = path.split("/",1)[0] if "/" in path else "(root)"
              if area not in seen:
                  seen.add(area)
                  areas.append(area)

          tests = []
          for path in changed:
              p = Path(path)
              stem = p.stem
              candidates = ["tests/test_" + stem + ".py", "test_" + stem + ".py"]
              for c in candidates:
                  if c in file_set and c not in tests:
                      tests.append(c)

          lines = ["# Change impact", "", "Base: " + before, "Head: " + head, "", "## Changed files"]
          if changed:
              lines += ["- " + statuses[p] + " " + p for p in changed[:60]]
              if len(changed) > 60:
                  lines.append("- ... " + str(len(changed) - 60) + " more")
          else:
              lines.append("- No non-AI files changed in the selected range.")

          lines += ["", "## Affected areas"]
          lines += ["- " + a for a in areas] if areas else ["- None detected."]
          lines += ["", "## Related test candidates"]
          lines += ["- " + t for t in tests[:20]] if tests else ["- No direct filename-based test match detected."]
          lines += [
              "",
              "## Agent guidance",
              "- Read this file before broad repository exploration.",
              "- Inspect only the affected areas first.",
              "- Use .ai/commands.json to choose validation commands.",
              "- Expand scope only if the change crosses module boundaries or tests fail.",
              ""
          ]
          Path(".ai/change-impact.md").write_text("\n".join(lines))
          PY

      - name: Commit generated intelligence
        if: ${{ inputs.commit_changes }}
        shell: bash
        run: |
          if git diff --quiet -- .ai/architecture.json .ai/commands.json .ai/change-impact.md \
             && git ls-files --error-unmatch .ai/architecture.json >/dev/null 2>&1 \
             && git ls-files --error-unmatch .ai/commands.json >/dev/null 2>&1 \
             && git ls-files --error-unmatch .ai/change-impact.md >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/architecture.json .ai/commands.json .ai/change-impact.md
          git commit -m "chore(ai): refresh context intelligence"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generated AI context
        if: ${{ !inputs.commit_changes }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-context-intelligence
          path: |
            .ai/architecture.json
            .ai/commands.json
            .ai/change-impact.md
          include-hidden-files: true
          if-no-files-found: error
